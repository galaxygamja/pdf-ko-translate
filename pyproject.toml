[project]
name = "pdf-ko-translate"
version = "0.2.0"
description = "영어 PDF를 레이아웃을 유지한 채 한국어로 번역"
readme = "README.md"
authors = [
    { name = "galaxygamja", email = "galaxygamja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.67.0",
    "pymupdf>=2.0",
    "pywebview>=6.2.1",
    "pythonnet>=3.0; sys_platform == 'win32'",
]

[dependency-groups]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.scripts]
pdf-ko-translate = "pdf_ko_translate:main"
pdf-ko-translate-app = "pdf_ko_translate.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# PyMuPDF 2.0 → pymupdf-layout이 끌어오는 onnxruntime은 Intel 맥용 배포판이 없다. 이 프로그램은 레이아웃 기능을 쓰지 않으므로 빼도 된다
override-dependencies = ["onnxruntime; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
